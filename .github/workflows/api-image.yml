name: Build self-hosted API image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'compose.yaml'
      - 'sandbox/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/api-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sandboxd-api-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pages-live-sandboxd-api:latest
            ghcr.io/${{ github.repository_owner }}/pages-live-sandboxd-api:${{ github.sha }}
